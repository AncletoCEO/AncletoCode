[graph]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "0BSD",
  "AGPL-3.0-only",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[advisories]
version = 2
yanked = "warn"
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "Transitiva del stack tauri/gtk fijado; sin reemplazo disponible todavía" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser es transitiva de cosmic-text/glyphon y winit; no hay versión corregida compatible con el stack fijado" },
]

[bans]
multiple-versions = "allow"

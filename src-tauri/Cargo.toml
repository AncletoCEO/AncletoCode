[package]
name = "ancleto-code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Workspace de agentes de código para escritorio y terminal"

[[bin]]
name = "ancleto-code-desktop"
path = "src/main.rs"

[lib]
name = "ancleto_code_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
ancleto-code-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { workspace = true, features = ["protocol-asset"] }
uuid.workspace = true
window-vibrancy.workspace = true

[lints]
workspace = true

[workspace]
resolver = "2"
members = [
  "crates/ancleto-code-core",
  "crates/ancleto-code-host",
  "crates/ancleto-code-cli",
  "crates/ancleto-code-cmd",
  "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "AGPL-3.0-only"

[workspace.dependencies]
alacritty_terminal = "0.26.0"
ancleto-code-core = { path = "crates/ancleto-code-core" }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
ctrlc = { version = "3.5.2", features = ["termination"] }
interprocess = "2.4.6"
portable-pty = "0.9.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2.12.5"
tempfile = "3.27.0"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v4"] }
window-vibrancy = "0.8.1"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
